# Apply with: kubectl create secret generic postgres-secret \
#   --namespace=url-shortener \
#   --from-literal=username=postgres \
#   --from-literal=password=postgres \
#   --from-literal=database=urlshortener
#
# Apply with: kubectl create secret generic honeycomb-secret \
#   --namespace=url-shortener \
#   --from-literal=api-key=YOUR_HONEYCOMB_API_KEY
#
# Or apply this file after replacing the placeholders below (base64-encoded):
#   echo -n "postgres"     | base64  → cG9zdGdyZXM=
#   echo -n "urlshortener" | base64  → dXJsc2hvcnRlbmVy
#   echo -n "YOUR_KEY"     | base64  → ...
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: url-shortener
type: Opaque
data:
  username: cG9zdGdyZXM=        # postgres
  password: cG9zdGdyZXM=        # postgres
  database: dXJsc2hvcnRlbmVy    # urlshortener
---
apiVersion: v1
kind: Secret
metadata:
  name: honeycomb-secret
  namespace: url-shortener
type: Opaque
stringData:
  api-key: "REPLACE_WITH_YOUR_HONEYCOMB_API_KEY"
